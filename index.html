<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) real, which the tab bar needs. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f1e9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f100e" media="(prefers-color-scheme: dark)" />
    <!-- Web app manifest for installability -->
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS meta tags for home screen apps -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta id="status-bar-style" name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ledger" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" href="/icons/icon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>Alpha Ledger</title>
    <script>
      // Stamps the stored theme before first paint, so an explicit light/dark choice never
      // flashes the other palette. Must stay in step with src/ui/theme.ts.
      try {
        var stored = localStorage.getItem('al.theme')
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored)
        }
        // Set status bar style to match the current theme: default (dark text) for light,
        // black-translucent (white text) for dark.
        var isDark =
          stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document
          .getElementById('status-bar-style')
          .setAttribute('content', isDark ? 'black-translucent' : 'default')
      } catch (error) {
        /* A private window can throw on access; the system theme is a fine fallback. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
