<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Light background: the rev 2 plane (docs/DESIGN.md 2.1). -->
  <rect width="512" height="512" fill="#f1f4f8"/>

  <!-- Main content: chart/ledger symbol -->
  <!-- Ledger lines -->
  <line x1="80" y1="140" x2="432" y2="140" stroke="#1c2331" stroke-width="12" stroke-linecap="round"/>
  <line x1="80" y1="210" x2="432" y2="210" stroke="#1c2331" stroke-width="12" stroke-linecap="round"/>
  <line x1="80" y1="280" x2="432" y2="280" stroke="#1c2331" stroke-width="12" stroke-linecap="round"/>
  <line x1="80" y1="350" x2="432" y2="350" stroke="#1c2331" stroke-width="12" stroke-linecap="round"/>

  <!-- Chart line (rising, going up) -->
  <polyline points="100,320 180,280 260,240 340,180 420,140"
            stroke="#0b67d9" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
